<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,Hiragino Sans,Noto Sans JP,sans-serif">
<title id="t">2つの動かし方</title><desc id="d">このMacだけで動かす方法と、翻訳だけ自分のサーバーに任せる方法の比較図</desc>
<rect width="960" height="270" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
<g text-anchor="middle" fill="#1f2328">
<rect x="30" y="24" width="430" height="222" rx="12" fill="#dafbe1" stroke="#4ac26b"/>
<text x="245" y="58" font-size="18" font-weight="700">このMac(完全ローカル)</text>
<text x="245" y="96" font-size="14">聞き取り・翻訳・読み上げが、すべて手元の Mac の中</text>
<text x="245" y="124" font-size="14">音声も文字もネットに送りません</text>
<text x="245" y="152" font-size="14">はじめての人はこちら(標準)</text>
<text x="245" y="192" font-size="13" fill="#57606a">ネットは、最初のモデル取得のときだけ</text>
<rect x="500" y="24" width="430" height="222" rx="12" fill="#fff8c5" stroke="#d4a72c"/>
<text x="715" y="58" font-size="18" font-weight="700">リモートGPU(任意・上級者向け)</text>
<text x="715" y="96" font-size="14">翻訳だけを、自分の用意したサーバーに任せる</text>
<text x="715" y="124" font-size="14">より大きな翻訳モデルで、用語や長い文に強くなる</text>
<text x="715" y="152" font-size="14">翻訳する文字が、そのサーバーに送られます</text>
<text x="715" y="192" font-size="13" fill="#57606a">サーバーを設定しなければ、何も送られません</text>
</g></svg>
